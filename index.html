<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cinebook" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Cinebook - Rede Social de Filmes, Séries e Livros</title>
    <meta name="description" content="Rede social estilo Instagram para filmes, séries e livros com listas, resenhas e feed em tempo real." />
    <meta property="og:title" content="Cinebook - Rede Social de Filmes, Séries e Livros" />
    <meta property="og:description" content="Rede social estilo Instagram para filmes, séries e livros com listas, resenhas e feed em tempo real." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // Suprime avisos benignos de WebSocket em ambiente de container/proxy iframe
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = reason && (reason.message || String(reason));
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws:') !== -1)) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws:') !== -1)) {
          event.preventDefault();
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
